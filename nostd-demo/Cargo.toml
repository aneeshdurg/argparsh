[package]
name = "argparsh-nostd-demo"
version = "0.1.0"
edition = "2021"
authors = ["Aneesh Durg <aneeshdurg17@gmail.com>"]
license = "MIT"
description = "no_std builder for argparsh parsers (emits bitcode for `argparsh parse`)"
publish = false

[[bin]]
# The package is "argparsh-nostd-demo" (the workspace root owns the name
# "argparsh"), but the binary it produces is the real front door.
name = "argparsh"
path = "src/main.rs"

[dependencies]
# Must stay in lockstep with argparsh's bitcode version so the encoded parser
# is readable by `argparsh parse`.
bitcode = { version = "=0.6.3", default-features = false, features = ["derive"] }
bitcode_derive = "=0.6.3"

# `[profile]` tables here are ignored (Cargo only reads them from the
# workspace root's Cargo.toml) but the root's `[profile.release]` already
# sets lto/codegen-units=1/opt-level=z/panic=abort, which covers this crate
# too.
