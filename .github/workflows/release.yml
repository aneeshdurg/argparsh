name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: "checkout repository"
        uses: actions/checkout@v4

      - name: "install rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: "build release binary"
        run: cargo build --release --target ${{ matrix.target }}

      - name: "build front door (x86_64 only)"
        # The freestanding `argparsh` front door (nostd-demo/) hand-rolls its
        # own x86_64 _start/syscalls and can't be built for aarch64 yet (see
        # nostd-demo/src/main.rs's compile_error!). It's also a separate
        # workspace member with its own linker config that can't be built in
        # the same invocation as argparsh-heavy above, so it needs its own
        # step, run from inside nostd-demo/ so that config is actually picked
        # up (--manifest-path doesn't do this).
        if: ${{ !startsWith(matrix.target, 'aarch64') }}
        run: (cd nostd-demo && cargo build --release --target ${{ matrix.target }})

      - name: "package artifact"
        run: |
          set -euo pipefail
          staging="argparsh-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$staging"
          if [ -f "target/${{ matrix.target }}/release/argparsh" ]; then
            cp "target/${{ matrix.target }}/release/argparsh" "$staging/"
          fi
          cp target/${{ matrix.target }}/release/argparsh-heavy "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: "upload build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: argparsh-${{ matrix.target }}
          path: argparsh-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "download build artifacts"
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: "create release"
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
