name: Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test argparsh
    runs-on: ubuntu-latest
    steps:
      - name: "checkout repository"
        uses: actions/checkout@v4

      - name: "install rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: "install pytest"
        run: |
          pip install pytest

      - name: "build"
        run: |
          # Pin the target explicitly: .cargo/config.toml defaults to the musl
          # target, but this job only has the native gnu target installed and we
          # want to keep testing the gnu build.
          cargo install --path . --target x86_64-unknown-linux-gnu
          cargo install --path nostd-demo --target x86_64-unknown-linux-gnu

      - name: "run tests"
        run: |
          pytest -v test/
