[package]
name = "argparsh"
version = "1.0.5"
edition = "2021"
autobins = false
authors = ["Aneesh Durg <aneeshdurg17@gmail.com>"]
license = "MIT"
homepage = "https://github.com/aneeshdurg/argparsh"
repository = "https://github.com/aneeshdurg/argparsh"
description = "Better argument parsing for shells"
keywords = [
  "argument",
  "cli",
  "arg",
  "parser",
  "parse"
]
categories = ["command-line-interface"]

[dependencies]
bitcode = { version = "=0.6.3", default-features = false, features = ["derive"] }
# Pinned to match bitcode core exactly: bitcode_derive is a transitive dep of
# bitcode's `derive` feature with a caret requirement (^0.6.3). A fresh resolve
# (e.g. `cargo install --path .` in CI) would float it to a newer 0.6.x whose
# generated code references bitcode::__private::Vec, which core 0.6.3 lacks.
bitcode_derive = "=0.6.3"
clap = { version = "4.5.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
urlencoding = "2.1.3"
libc = { version = "0.2", default-features = false }

[[bin]]
name = "argparsh"
path = "nostd-demo/src/main.rs"

[[bin]]
name = "argparsh-heavy"
path = "src/main.rs"

[profile.release]
opt-level = "z"     # Optimize for the smallest possible binary size ("s" is also good)
strip = true        # Automatically strip symbols and debug info from the binary
lto = true          # Enable Link-Time Optimization (cross-crate optimizations)
codegen-units = 1   # Reduce parallel code generation units (allows better size optimization)
panic = "abort"     # Remove panic unwinding overhead (removes backtrace sta

[profile.dev]
panic = "abort"
